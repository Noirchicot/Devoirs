<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16213e">
  <title>Fiches d’allemand — Leto</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
      --ink: #f8f8ff;
      --muted: #b8c1d9;
      --accent: #80e1d1;
      --accent-2: #9aa9ff;
      --surface: #202d51;
      --surface-2: #31426f;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(128, 225, 209, .16), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(154, 169, 255, .18), transparent 35%),
        #10182e;
    }

    main {
      width: min(100%, 34rem);
      padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 4vw, 1.25rem);
      font-weight: 700;
      letter-spacing: .01em;
    }

    h1 a {
      color: inherit;
      text-decoration: none;
    }

    h1 a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
      border-radius: .25rem;
    }

    #counter {
      flex: none;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: .95rem;
    }

    .card-shell {
      width: 100%;
      aspect-ratio: 4 / 5;
      max-height: 67svh;
      perspective: 1000px;
      cursor: pointer;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 420ms cubic-bezier(.2, .75, .25, 1);
    }

    .card-shell.flipped .card { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 7vw, 3rem);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 1.75rem;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .32);
    }

    .front {
      background: linear-gradient(145deg, var(--surface-2), var(--surface));
    }

    .back {
      transform: rotateY(180deg);
      color: #13203b;
      background: linear-gradient(145deg, #d8fff7, #a9e9df);
    }

    .word {
      max-width: 100%;
      text-align: center;
      font-size: clamp(2rem, 9vw, 4rem);
      font-weight: 760;
      line-height: 1.12;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .language {
      position: absolute;
      top: 1.4rem;
      left: 1.5rem;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .back .language { color: #42605c; }

    nav {
      display: grid;
      grid-template-columns: 3.25rem 1fr 3.25rem;
      align-items: center;
      gap: .75rem;
      margin-top: 1rem;
    }

    button {
      width: 3.25rem;
      height: 3.25rem;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 255, 255, .08);
      font: inherit;
      font-size: 1.4rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.94); }

    button:focus-visible,
    .card-shell:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .hint {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><a href="index.html" aria-label="Retour au menu">← <span id="direction"></span></a></h1>
      <span id="counter" aria-live="polite"></span>
    </header>

    <div
      class="card-shell"
      id="cardShell"
      role="button"
      tabindex="0"
      aria-label="Retourner la fiche"
      aria-pressed="false"
    >
      <div class="card">
        <section class="face front" aria-hidden="false">
          <span class="language" id="frontLanguage"></span>
          <div class="word" id="frontWord"></div>
        </section>
        <section class="face back" aria-hidden="true">
          <span class="language" id="backLanguage"></span>
          <div class="word" id="backWord"></div>
        </section>
      </div>
    </div>

    <nav aria-label="Navigation entre les fiches">
      <button type="button" id="previous" aria-label="Fiche précédente">←</button>
      <p class="hint">Touche la carte pour la retourner</p>
      <button type="button" id="next" aria-label="Fiche suivante">→</button>
    </nav>
  </main>

  <script>
    const cards = [
      ["schlagen", "battre"],
      ["die Gewalt", "la violence"],
      ["traurig", "triste"],
      ["der Streit", "la dispute"],
      ["das Date", "le rendez-vous"],
      ["fremdgehen", "tromper son partenaire"],
      ["der Hass", "la haine"],
      ["enttäuscht", "déçu"],
      ["hassen", "détester"],
      ["besorgt", "inquiet / soucieux"],
      ["eifersüchtig", "jaloux"],
      ["heiraten", "se marier"],
      ["fremd", "étranger"],
      ["verliebt sein", "être amoureux"],
      ["miteinander gehen", "sortir ensemble"],
      ["lieben", "aimer"],
      ["vertrauen", "faire confiance"],
      ["die Liebe", "l’amour"],
      ["der Freund", "l’ami / le petit ami"],
      ["glücklich", "heureux"],
      ["der Kumpel", "le pote"],
      ["zusammen", "ensemble"],
      ["gewalttätig", "violent"],
      ["die Beziehung", "la relation"]
    ];

    const shell = document.querySelector("#cardShell");
    const frontWord = document.querySelector("#frontWord");
    const backWord = document.querySelector("#backWord");
    const frontLanguage = document.querySelector("#frontLanguage");
    const backLanguage = document.querySelector("#backLanguage");
    const direction = document.querySelector("#direction");
    const counter = document.querySelector("#counter");
    const front = document.querySelector(".front");
    const back = document.querySelector(".back");
    const frenchFirst = new URLSearchParams(location.search).get("sens") === "fr-de";
    let index = 0;

    frontLanguage.textContent = frenchFirst ? "Français" : "Allemand";
    backLanguage.textContent = frenchFirst ? "Allemand" : "Français";
    direction.textContent = frenchFirst ? "Français → allemand" : "Allemand → français";
    document.title = `${direction.textContent} — Leto`;

    function showCard() {
      const [de, fr] = cards[index];
      frontWord.textContent = frenchFirst ? fr : de;
      backWord.textContent = frenchFirst ? de : fr;
      counter.textContent = `${index + 1} / ${cards.length}`;
      shell.classList.remove("flipped");
      shell.setAttribute("aria-pressed", "false");
      front.setAttribute("aria-hidden", "false");
      back.setAttribute("aria-hidden", "true");
    }

    function flipCard() {
      const flipped = shell.classList.toggle("flipped");
      shell.setAttribute("aria-pressed", String(flipped));
      front.setAttribute("aria-hidden", String(flipped));
      back.setAttribute("aria-hidden", String(!flipped));
    }

    function move(step) {
      index = (index + step + cards.length) % cards.length;
      showCard();
    }

    shell.addEventListener("click", flipCard);
    shell.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      }
    });
    document.querySelector("#previous").addEventListener("click", () => move(-1));
    document.querySelector("#next").addEventListener("click", () => move(1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
    });

    showCard();
  </script>
</body>
</html>
